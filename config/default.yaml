kafka:
  bootstrap_servers: localhost:9092
  topic: vitals.raw
  partitions: 3
  acks: all

streaming:
  watermark: "2 minutes"
  window: "5 minutes"
  slide: "1 minute"
  trigger: "30 seconds"
  starting_offsets: latest

# Durability lake. Empty uri = local dev (no HDFS, checkpoints under ./checkpoints).
# The docker-compose stack overrides this via config/docker.yaml.
hdfs:
  uri: ""
  base: /vytals

postgres:
  host: localhost
  port: 5434  # host 5432 = local pg, 5433 = care_db — see docker-compose.yml
  db: vytals
  user: vytals
  password: vytals

api:
  host: 0.0.0.0
  port: 8000

model:
  path: models/xgb_risk.json
  version: v1

vitals:
  - hr
  - spo2
  - rr
  - temp_c
  - sbp
  - dbp
