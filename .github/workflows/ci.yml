name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build + vet
        run: |
          go build ./...
          go vet ./...
      - name: Sample data
        run: go run ./cmd/vytal-makedata --patients 4 --minutes 30 --out /tmp/vitals_ci.csv
      - name: Loader check
        run: go run ./cmd/vytal-loader --input /tmp/vitals_ci.csv
      - name: Train check (small)
        run: go run ./cmd/vytal-train --input /tmp/vitals_ci.csv --out /tmp/risk_ci.json
      - name: Predict check
        run: go run ./cmd/vytal-predict --input /tmp/vitals_ci.csv --model /tmp/risk_ci.json --limit 4
      - name: API smoke
        run: |
          VYTALS_DATA=/tmp/vitals_ci.csv VYTALS_MODEL=/tmp/risk_ci.json go run ./cmd/vytal-server & echo $! > /tmp/api.pid
          sleep 6
          curl -sf localhost:8000/api/health
          curl -sf localhost:8000/api/patients | head -c 200; echo
          curl -sf localhost:8000/api/analysis | head -c 200; echo
          kill $(cat /tmp/api.pid)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
